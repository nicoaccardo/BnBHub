<ion-content>
  <main class="redirect-shell">
    <section class="redirect-panel" aria-labelledby="redirect-title">
      <div class="brand-mark" aria-label="BnBHub">
        BnBHub
      </div>

      <p class="eyebrow">Pagina non disponibile</p>
      <h1 id="redirect-title">Potrebbe esserci un errore nel percorso.</h1>
      <p class="redirect-copy">
        La pagina richiesta non esiste oppure non appartiene alla tua area di accesso.
      </p>

      <ion-button color="secondary" (click)="goHome()">
        <ion-icon aria-hidden="true" name="home-outline" slot="start"></ion-icon>
        Torna alla home
      </ion-button>
    </section>
  </main>
</ion-content>
